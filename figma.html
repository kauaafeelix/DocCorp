<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentação do Figma - DocCorp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'figma-bg': '#F8F9FB',
                        'figma-gray': '#6B7280',
                        'figma-primary': '#2370D5',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 antialiased">

    <aside class="fixed top-0 left-0 z-30 w-80 h-screen bg-white border-r border-gray-200 flex flex-col overflow-y-auto">

        <div class="p-5 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <img class="h-10 w-10" src="../images/figma-logo.png" alt="Logo do Figma">
                <div>
                    <h4 class="text-lg font-semibold text-gray-900">Figma</h4>
                    <p class="text-sm text-gray-500">Manual do Usuário</p>
                </div>
            </div>
        </div>

        <div class="p-5 border-b border-gray-100">
        <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg id="search-icon" class="w-5 h-5 text-gray-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>

            
            <input 
                id="search-input"
                type="text" 
                placeholder="Buscar na documentação..." 
                class="w-full pl-10 pr-10 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition"
            >

            <button 
                id="clear-search"
                type="button"
                class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-700 focus:outline-none hidden"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

    <nav class="flex-1 px-3 py-6 overflow-y-auto">
        <ul class="space-y-2">
            
            <li>
                <input type="checkbox" id="intro-home" class="peer hidden "  /> 
                <label for="intro" class="flex items-center justify-between px-4 py-3 text-sm font-semibold text-gray-900 bg-gray-100 rounded-lg cursor-pointer hover:bg-gray-200 transition group">
                    Página Inicial
                </label>

                <input type="checkbox" id="intro" class="peer hidden" checked/> 
                <label for="intro" class="flex items-center justify-between px-4 py-3 text-sm font-semibold text-gray-900 rounded-lg cursor-pointer hover:bg-gray-200 transition group">
                    Introdução
                    <svg class="w-4 h-4 text-gray-500 transition-transform group-peer-checked:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </label>
                <ul class="mt-1 ml-4 space-y-1 hidden peer-checked:block">
                    <li>
                        <a href="introducao/o-que-e-figma.html" class="block px-4 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-50 hover:text-blue-600 transition">
                            O que é o Figma?
                        </a>
                    </li>
                    <li>
                        <a href="introducao/visao-geral-interface.html" class="block px-4 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-50 hover:text-blue-600 transition">
                            Visão geral da interface
                        </a>
                    </li>
                    <li>
                        <a href="introducao/requisitos-sistema.html" class="block px-4 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-50 hover:text-blue-600 transition">
                            Requisitos do sistema
                        </a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="primeiros" class="peer hidden" checked/>
                <label for="primeiros" class="flex items-center justify-between px-4 py-3 text-sm font-semibold text-gray-900 rounded-lg cursor-pointer hover:bg-gray-100 transition group">
                    Primeiros passos
                    <svg class="w-4 h-4 text-gray-500 transition-transform group-peer-checked:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </label>
                <ul class="mt-1 ml-4 space-y-1 hidden peer-checked:block">
                    <li>
                        <a href="primeiros/criar-conta.html" class="block px-4 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-50 hover:text-blue-600 transition">
                            Criar uma conta
                        </a>
                    </li>
                    <li>
                        <a href="primeiros/configurar-workspace.html" class="block px-4 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-50 hover:text-blue-600 transition">
                            Configurar o workspace
                        </a>
                    </li>
                    <li>
                        <a href="primeiros/navegacao-basica.html" class="block px-4 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-50 hover:text-blue-600 transition">
                            Navegação básica
                        </a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="ferramentas" class="peer hidden" checked/>
                <label for="ferramentas" class="flex items-center justify-between px-4 py-3 text-sm font-semibold text-gray-900 rounded-lg cursor-pointer hover:bg-gray-100 transition group">
                    Ferramentas de Design
                    <svg class="w-4 h-4 text-gray-500 transition-transform group-peer-checked:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </label>
                <ul class="mt-1 ml-4 space-y-1 hidden peer-checked:block">
                    <li>
                        <a href="ferramentas/frames-grupos.html" class="block px-4 py-2 text-sm text-gray-700 rounded-lg hover:bg-gray-50 hover:text-blue-600 transition">
                            Frames e Grupos
                        </a>
                    </li>
                </ul>
            </li>
            

        </ul>
    </nav>

    </aside>

    <main class="ml-80 min-h-screen">

        <div class="flex items-center text-sm justify-between px-6 ">
        <div class="pt-3 h-12 r">
            <a href="index.html" class="block group flex items-center text-gray-500 hover:text-figma-primary transition-colors">
                <svg width="22" height="22" viewBox="0 0 24 24">
                <path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12l4.58-4.59z"/>
                </svg>
                <h1>Voltar ao início do Site</h1>
                
            </a>
            
        </div>
        <div class="text-gray-500 flex justify-end pr-10 text-sm">Manual do Usuário Figma</div>
        </div>
        <div class="border-b border-gray-200 "></div>

    </main>

    <script src="search.js"></script>

</body>
</html>
