<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentação do Figma - DocCorp</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {} } }
    </script>
</head>
<body>
    <main id="main-figma">

        <section id="hero-navbar">

            <section class="bg-gray-50 w-80 h-40" id="header-navbar">
                <div class="flex items-center pt-5 pl-5" id="header-top">
                    <img class="h-12 w-12" src="../images/figma-logo.png" alt="Logo do Figma" id="header-top-logo">
                    <div id="header-top-name">
                            <h4 class="text-lg font-medium">Figma</h4>
                            <p class="text-sm">Manual do Usuário</p>
                    </div>
                </div>
                <div class="ml-7 mt-5 flex items-center w-60 px-3 py-2 bg-white border border-gray-200 rounded-lg shadow-sm focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input 
                        type="text" 
                        placeholder="Buscar na documentação..." 
                        class="w-full ml-2 text-sm text-gray-700 placeholder-gray-500 bg-transparent outline-none"
                    >
                </div>
            </section>

            

        </section>

        <section id="hero-figma-index">

        </section>
    </main>
    
</body>
</html>
